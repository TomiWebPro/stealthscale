---
version: 2
before:
  hooks:
    - go mod tidy -compat=1.26
    - go mod vendor

release:
  prerelease: auto
  draft: true
  header: |
    ## Upgrade

    Please follow the steps outlined in the [upgrade guide](https://stealthscale.net/stable/setup/upgrade/) to update your existing StealthScale installation.

builds:
  # Single unified binary: stscale is both coordinator and node.
  # There is no separate client binary — the same binary runs as client via `stscale up`
  # and as server via `stscale serve`. The VLESS+Reality transport is built in.
  # Alpha 4: Docker enabled via kos (distroless base) alongside all native OS/arch.
  # ARM 32-bit: linux_arm_6 (GOARM=6, Raspberry Pi Zero) and linux_arm_7 (GOARM=7, Pi 2/3/4 32-bit)
  # plus linux_arm (generic) for compatibility; ARM 64-bit via linux_arm64/darwin_arm64/windows_arm64.
  - id: stealthscale
    main: ./cmd/stealthscale
    binary: stscale
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_amd64
      - darwin_arm64
      - freebsd_amd64
      - freebsd_arm64
      - linux_amd64
      - linux_arm64
      - linux_arm
      - linux_arm_6
      - linux_arm_7
      - windows_amd64
      - windows_arm64
    flags:
      - -mod=readonly

# Archives: binary for linux/freebsd; tar.gz/zip handled via binary naming
# (goreleaser appends .exe for windows automatically). Docker images via kos.
# See packaging/launchd, packaging/windows and docs/setup/install/container.md.
archives:
  - id: golang-cross
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    formats:
      - binary

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}"
  format: tar.gz
  files:
    - "vendor/"

nfpms:
  # Configure nFPM for .deb releases
  #
  # See https://goreleaser.com/customization/package/nfpm/
  #
  # Useful tools for debugging .debs:
  # List file contents: dpkg -c dist/stealthscale...deb
  # Package metadata: dpkg --info dist/stealthscale....deb
  #
  - ids:
      - stealthscale
    package_name: stealthscale
    priority: optional
    vendor: stealthscale
    maintainer: StealthScale authors
    homepage: https://github.com/tomiwebpro/stealthscale
    description: |-
      StealthScale control server — open source Tailscale control server that replaces
      WireGuard with the VLESS+XRay+uTLS (Reality) transport to provide a self-hosted,
      stealth alternative. Implements a single tailnet for personal or small-org use.
      Docker images via ghcr.io/tomiwebpro/stealthscale (distroless, linux/amd64,arm64).
    bindir: /usr/bin
    section: net
    formats:
      - deb
    contents:
      - src: ./config-example.yaml
        dst: /etc/stealthscale/config.yaml
        type: config|noreplace
        file_info:
          mode: 0644
      - src: ./packaging/systemd/stealthscale.service
        dst: /usr/lib/systemd/system/stealthscale.service
      - dst: /var/lib/stealthscale
        type: dir
      - src: ./config-example.yaml
        dst: /usr/share/doc/stealthscale/examples/config-example.yaml
      - src: LICENSE
        dst: /usr/share/doc/stealthscale/copyright
    scripts:
      postinstall: ./packaging/deb/postinst
      postremove: ./packaging/deb/postrm
      preremove: ./packaging/deb/prerm
    deb:
      lintian_overrides:
        - no-changelog # Our CHANGELOG.md uses a different formatting
        - no-manual-page
        - statically-linked-binary

# Docker images via ko (distroless) — enabled for alpha.4 (full docker compatibility).
# Produces ghcr.io/tomiwebpro/stealthscale:{tag,unstable/stable,latest,sha} and :debug variants.
# The base image is distroless (no shell in :latest, busybox in :debug). The binary is /ko-app/stscale.
# Expose ports 8080 (control), 9090 (metrics), 3478/udp (STUN), 10001-10100 (VLESS Reality).
kos:
  - id: ghcr
    repositories:
      - ghcr.io/tomiwebpro/stealthscale
    bare: true
    base_image: gcr.io/distroless/base-debian13
    build: stealthscale
    main: ./cmd/stealthscale
    env:
      - CGO_ENABLED=0
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ if not .Prerelease }}latest{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}.{{ .Patch }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}.{{ .Patch }}{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}stable{{ else }}unstable{{ end }}"
      - "{{ .Tag }}"
      - '{{ trimprefix .Tag "v" }}'
      - "sha-{{ .ShortCommit }}"
    creation_time: "{{.CommitTimestamp}}"
    ko_data_creation_time: "{{.CommitTimestamp}}"
  - id: ghcr-debug
    repositories:
      - ghcr.io/tomiwebpro/stealthscale
    bare: true
    base_image: gcr.io/distroless/base-debian13:debug
    build: stealthscale
    main: ./cmd/stealthscale
    env:
      - CGO_ENABLED=0
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ if not .Prerelease }}latest-debug{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}.{{ .Patch }}-debug{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}-debug{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}-debug{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}.{{ .Patch }}-debug{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}-debug{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}-debug{{ end }}"
      - "{{ if not .Prerelease }}stable-debug{{ else }}unstable-debug{{ end }}"
      - "{{ .Tag }}-debug"
      - '{{ trimprefix .Tag "v" }}-debug'
      - "sha-{{ .ShortCommit }}-debug"

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
