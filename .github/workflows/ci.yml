name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Build
        run: make build
      - name: Test (short, race)
        run: go test -race -short ./hscontrol/... 2>&1 | tail -50
      - name: Test stealth
        run: go test -v ./hscontrol/stealth ./hscontrol/xray ./hscontrol/derp 2>&1 | tail -30
      - name: Vet
        run: go vet ./...
      - name: Check deb packaging
        run: |
          cat packaging/systemd/stealthscale.service | grep -q "StateDirectory=stealthscale" || (echo "StateDirectory mismatch" && exit 1)
          cat .goreleaser.yml | grep -q "freebsd_arm64" || (echo "goreleaser missing freebsd_arm64" && exit 1)
          echo "packaging checks ok"
      - name: Check versioning convention
        run: |
          grep -q "nightly" hscontrol/db/versioncheck.go || (echo "isDev must handle nightly" && exit 1)
          test -f docs/about/versioning.md || (echo "versioning.md missing" && exit 1)
          echo "versioning checks ok"

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: go vet ./hscontrol/db -run TestVersionCheck 2>&1 | head -20

