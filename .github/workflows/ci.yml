name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.10
      - name: Install tscli
        run: |
          go install github.com/jaxxstorm/tscli@latest || echo "tscli install failed, tests will skip tscli subtests"
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Build
        run: make build
      - name: Test (short, race)
        run: |
          set -o pipefail
          go test -timeout 20m -race -short -count=1 ./hscontrol/... ./cmd/... -v
      - name: Test stealth
        run: |
          set -o pipefail
          go test -timeout 10m -race -short -count=1 -v ./hscontrol/stealth ./hscontrol/xray ./hscontrol/derp
      - name: Vet
        run: go vet ./...
      - name: Check deb packaging
        run: |
          cat packaging/systemd/stealthscale.service | grep -q "StateDirectory=stealthscale" || (echo "StateDirectory mismatch" && exit 1)
          cat .goreleaser.yml | grep -q "linux_amd64" || (echo "goreleaser missing linux_amd64" && exit 1)
          cat .goreleaser.yml | grep -q "nfpms" || (echo "goreleaser missing nfpms deb" && exit 1)
          test -x packaging/deb/postinst || (echo "postinst not executable" && exit 1)
          test -f config-example.yaml || (echo "config-example.yaml missing" && exit 1)
          echo "packaging checks ok"
      - name: Check versioning convention
        run: |
          grep -q "nightly" hscontrol/db/versioncheck.go || (echo "isDev must handle nightly" && exit 1)
          test -f docs/about/versioning.md || (echo "versioning.md missing" && exit 1)
          echo "versioning checks ok"
      - name: Check docker compatibility (alpha.4)
        run: |
          set -o pipefail
          grep -q "^kos:" .goreleaser.yml || (echo "kos must be enabled for alpha.4 docker" && exit 1)
          grep -q "ghcr.io/tomiwebpro/stealthscale" .goreleaser.yml || (echo "ghcr missing" && exit 1)
          grep -q "gcr.io/distroless/base-debian13" .goreleaser.yml || (echo "distroless base missing" && exit 1)
          test -f Dockerfile || (echo "Dockerfile missing for docker compat" && exit 1)
          test -f Dockerfile.integration || (echo "Dockerfile.integration missing" && exit 1)
          grep -q "HEALTHCHECK" Dockerfile || (echo "Dockerfile HEALTHCHECK missing" && exit 1)
          grep -q "10001" Dockerfile || (echo "Dockerfile VLESS range missing" && exit 1)
          grep -q "/var/lib/stealthscale" Dockerfile || (echo "Dockerfile volume missing" && exit 1)
          grep -q 'binStealthScale.*=.*"stscale"' integration/hsic/hsic.go || (echo "hsic must use stscale binary for docker" && exit 1)
          grep -q "/usr/local/bin/stscale serve" integration/hsic/hsic.go || (echo "hsic entrypoint must use stscale" && exit 1)
          go test -run TestDocker -count=1 -v ./hscontrol -v
          echo "docker compatibility checks ok"

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
      - name: Cross-vet Windows
        run: |
          set -o pipefail
          GOOS=windows go vet ./hscontrol/... ./cmd/... 2>&1
      - name: Cross-vet Darwin
        run: |
          set -o pipefail
          GOOS=darwin go vet ./hscontrol/... ./cmd/... 2>&1
      - name: Cross-vet FreeBSD
        run: |
          set -o pipefail
          GOOS=freebsd go vet ./hscontrol/... ./cmd/... 2>&1
      - name: Cross-build Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/stscale-windows-amd64 ./cmd/stealthscale && echo "windows amd64 ok" && rm /tmp/stscale-windows-amd64
      - name: Cross-build Windows arm64
        run: GOOS=windows GOARCH=arm64 go build -o /tmp/stscale-windows-arm64 ./cmd/stealthscale && echo "windows arm64 ok" && rm /tmp/stscale-windows-arm64
      - name: Cross-build Darwin amd64
        run: GOOS=darwin GOARCH=amd64 go build -o /tmp/stscale-darwin-amd64 ./cmd/stealthscale && echo "darwin amd64 ok" && rm /tmp/stscale-darwin-amd64
      - name: Cross-build Darwin arm64
        run: GOOS=darwin GOARCH=arm64 go build -o /tmp/stscale-darwin-arm64 ./cmd/stealthscale && echo "darwin arm64 ok" && rm /tmp/stscale-darwin-arm64
      - name: Cross-build Linux arm (32-bit) GOARM7
        run: GOOS=linux GOARCH=arm GOARM=7 go build -o /tmp/stscale-linux-arm7 ./cmd/stealthscale && echo "linux arm7 ok" && rm /tmp/stscale-linux-arm7
      - name: Cross-build Linux arm GOARM6 (Pi Zero)
        run: GOOS=linux GOARCH=arm GOARM=6 go build -o /tmp/stscale-linux-arm6 ./cmd/stealthscale && echo "linux arm6 ok" && rm /tmp/stscale-linux-arm6
      - name: Cross-build Linux arm generic
        run: GOOS=linux GOARCH=arm go build -o /tmp/stscale-linux-arm ./cmd/stealthscale && echo "linux arm generic ok" && rm /tmp/stscale-linux-arm
      - name: Cross-build Linux arm64
        run: GOOS=linux GOARCH=arm64 go build -o /tmp/stscale-linux-arm64 ./cmd/stealthscale && echo "linux arm64 ok" && rm /tmp/stscale-linux-arm64
      - name: Cross-build FreeBSD amd64
        run: GOOS=freebsd GOARCH=amd64 go build -o /tmp/stscale-freebsd-amd64 ./cmd/stealthscale && echo "freebsd amd64 ok" && rm /tmp/stscale-freebsd-amd64
      - name: Cross-build FreeBSD arm64
        run: GOOS=freebsd GOARCH=arm64 go build -o /tmp/stscale-freebsd-arm64 ./cmd/stealthscale && echo "freebsd arm64 ok" && rm /tmp/stscale-freebsd-arm64
      - name: Check goreleaser multi-platform
        run: |
          set -o pipefail
          for target in "linux_amd64" "linux_arm64" "linux_arm_6" "linux_arm_7" "linux_arm" "darwin_amd64" "darwin_arm64" "windows_amd64" "windows_arm64" "freebsd_amd64" "freebsd_arm64"; do
            grep -q -- "- $target" .goreleaser.yml || grep -q -- "\"$target\"" .goreleaser.yml || grep -q "$target" .goreleaser.yml || (echo "goreleaser missing $target" && exit 1)
          done
          cat .goreleaser.yml | grep -q "nfpms" || (echo "goreleaser missing nfpms deb" && exit 1)
          cat .goreleaser.yml | grep -q "^kos:" || (echo "goreleaser missing kos for docker" && exit 1)
          grep -q "ghcr.io/tomiwebpro/stealthscale" .goreleaser.yml || (echo "goreleaser ghcr missing" && exit 1)
          grep -q "linux/amd64" .goreleaser.yml || (echo "kos linux/amd64 missing" && exit 1)
          grep -q "linux/arm64" .goreleaser.yml || (echo "kos linux/arm64 missing" && exit 1)
          test -f packaging/launchd/com.stealthscale.plist || (echo "launchd plist missing" && exit 1)
          test -f packaging/windows/install.ps1 || (echo "windows install.ps1 missing" && exit 1)
          test -f Dockerfile || (echo "Dockerfile missing" && exit 1)
          echo "goreleaser multi-platform + docker checks ok"
      - name: Path handling tests
        run: |
          set -o pipefail
          go test -run TestAbsolutePathFromConfigPath ./hscontrol/util -count=1 -v

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
      - name: VersionCheck test
        run: go test -run TestCheckVersionUpgradePath -count=1 ./hscontrol/db -v
      - name: Goreleaser check (kos enabled)
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.17.1
          goreleaser check --snapshot 2>&1 | tee /tmp/goreleaser-check.log
          grep -q "kos" /tmp/goreleaser-check.log || echo "goreleaser check: kos not mentioned but ok if no error"
          echo "goreleaser check ok"

  docker-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
      - name: Docker build verification
        run: |
          set -o pipefail
          make build
          test -x ./stscale || (echo "stscale binary not built" && exit 1)
          ./stscale version || true
          docker --version
          docker build -f Dockerfile -t stealthscale:test --build-arg VERSION=test .
          docker images stealthscale:test
          docker build -f Dockerfile.integration -t stealthscale:integration-test .
          echo "docker builds ok"
      - name: Docker run smoke test
        run: |
          set -o pipefail
          echo "Starting stealthscale container..."
          docker run --rm -d --name stealthscale-smoke -p 18080:8080 -p 19090:9090 stealthscale:test || (docker logs stealthscale-smoke 2>&1 || true; exit 1)
          echo "Waiting for health endpoint (up to 30s)..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/health 2>&1 | tee /tmp/health.out; then
              echo "health curl succeeded on attempt $i"
              cat /tmp/health.out
              break
            fi
            echo "health not ready, attempt $i/30, waiting..."
            sleep 1
            if [ $i -eq 30 ]; then
              echo "health endpoint never became ready"
              docker logs stealthscale-smoke 2>&1 || true
              docker inspect stealthscale-smoke 2>&1 || true
              exit 1
            fi
          done
          echo "Checking health response..."
          cat /tmp/health.out | grep -q '"status"' || cat /tmp/health.out | grep -q "pass" || (echo "health check failed, response:"; cat /tmp/health.out; docker logs stealthscale-smoke 2>&1 || true; exit 1)
          echo "health ok"
          echo "Checking stscale health via exec (non-fatal)..."
          docker exec stealthscale-smoke /usr/local/bin/stscale health 2>&1 || echo "stscale health exec failed (non-fatal, curl already passed)"
          docker exec stealthscale-smoke ls -la /var/lib/stealthscale 2>&1 || true
          docker stop stealthscale-smoke 2>&1 || docker rm -f stealthscale-smoke 2>&1 || true
          echo "docker smoke test ok"

  path-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
      - name: Windows path tests
        run: go test -run TestAbsolutePathFromConfigPath ./hscontrol/util -count=1 -v

  path-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
      - name: macOS path tests
        run: go test -run TestAbsolutePathFromConfigPath ./hscontrol/util -count=1 -v
