name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Build
        run: make build
      - name: Test (short, race)
        run: go test -race -short ./hscontrol/... 2>&1 | tail -50
      - name: Test stealth
        run: go test -v ./hscontrol/stealth ./hscontrol/xray ./hscontrol/derp 2>&1 | tail -30
      - name: Vet
        run: go vet ./...
      - name: Check deb packaging
        run: |
          cat packaging/systemd/stealthscale.service | grep -q "StateDirectory=stealthscale" || (echo "StateDirectory mismatch" && exit 1)
          cat .goreleaser.yml | grep -q "linux_amd64" || (echo "goreleaser missing linux_amd64" && exit 1)
          cat .goreleaser.yml | grep -q "nfpms" || (echo "goreleaser missing nfpms deb" && exit 1)
          echo "packaging checks ok"
      - name: Check versioning convention
        run: |
          grep -q "nightly" hscontrol/db/versioncheck.go || (echo "isDev must handle nightly" && exit 1)
          test -f docs/about/versioning.md || (echo "versioning.md missing" && exit 1)
          echo "versioning checks ok"

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Cross-vet Windows
        run: GOOS=windows go vet ./hscontrol/util ./hscontrol/types ./cmd/stealthscale/... 2>&1 | tail -20
      - name: Cross-vet Darwin
        run: GOOS=darwin go vet ./hscontrol/util ./hscontrol/types ./cmd/stealthscale/... 2>&1 | tail -20
      - name: Cross-build Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/stscale-windows-amd64 ./cmd/stealthscale && echo "windows amd64 ok" && rm /tmp/stscale-windows-amd64
      - name: Cross-build Windows arm64
        run: GOOS=windows GOARCH=arm64 go build -o /tmp/stscale-windows-arm64 ./cmd/stealthscale && echo "windows arm64 ok" && rm /tmp/stscale-windows-arm64
      - name: Cross-build Darwin amd64
        run: GOOS=darwin GOARCH=amd64 go build -o /tmp/stscale-darwin-amd64 ./cmd/stealthscale && echo "darwin amd64 ok" && rm /tmp/stscale-darwin-amd64
      - name: Cross-build Darwin arm64
        run: GOOS=darwin GOARCH=arm64 go build -o /tmp/stscale-darwin-arm64 ./cmd/stealthscale && echo "darwin arm64 ok" && rm /tmp/stscale-darwin-arm64
      - name: Cross-build Linux arm (32-bit)
        run: GOOS=linux GOARCH=arm GOARM=7 go build -o /tmp/stscale-linux-arm7 ./cmd/stealthscale && echo "linux arm7 ok" && rm /tmp/stscale-linux-arm7
      - name: Cross-build Linux arm64
        run: GOOS=linux GOARCH=arm64 go build -o /tmp/stscale-linux-arm64 ./cmd/stealthscale && echo "linux arm64 ok" && rm /tmp/stscale-linux-arm64
      - name: Check goreleaser multi-platform
        run: |
          for target in linux_amd64 linux_arm64 linux_arm darwin_amd64 darwin_arm64 windows_amd64 windows_arm64 freebsd_amd64 freebsd_arm64; do
            cat .goreleaser.yml | grep -q "$target" || (echo "goreleaser missing $target" && exit 1)
          done
          cat .goreleaser.yml | grep -q "nfpms" || (echo "goreleaser missing nfpms deb" && exit 1)
          test -f packaging/launchd/com.stealthscale.plist || (echo "launchd plist missing" && exit 1)
          test -f packaging/windows/install.ps1 || (echo "windows install.ps1 missing" && exit 1)
          echo "goreleaser multi-platform checks ok"
      - name: Path handling tests
        run: go test -run TestAbsolutePathFromConfigPath ./hscontrol/util -count=1 -v 2>&1 | tail -30

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: go vet ./hscontrol/db -run TestVersionCheck 2>&1 | head -20

