name: Release

on:
  push:
    tags: ['v*', 'stable', 'alpha', 'nightly']

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
      - name: Map floating tag to semver for goreleaser
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            stable) echo "GORELEASER_CURRENT_TAG=v0.0.1" >> $GITHUB_ENV ;;
            alpha)  echo "GORELEASER_CURRENT_TAG=v0.0.1-alpha" >> $GITHUB_ENV ;;
            nightly) echo "GORELEASER_CURRENT_TAG=v0.0.1-nightly" >> $GITHUB_ENV ;;
            *) echo "GORELEASER_CURRENT_TAG=$TAG" >> $GITHUB_ENV ;;
          esac
          echo "Mapped $TAG -> $(grep GORELEASER_CURRENT_TAG $GITHUB_ENV | cut -d= -f2)"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.GORELEASER_CURRENT_TAG }}
